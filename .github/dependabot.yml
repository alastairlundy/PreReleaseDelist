# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

# Version updates run weekly (Mondays) with a 14-day cooldown so fast-moving
# packages don't open a PR per release. Cooldown only applies to version
# updates; Dependabot security updates are unaffected.

version: 2
updates:
  # Dependabot's NuGet updater only looks for entry points that sit *directly* in
  # the configured directory; it does not recurse into subdirectories. The repo
  # root has no solution or project file, so "directory: /" finds nothing and
  # silently reports zero dependencies.
  #
  # "src" contains the solution that references every project in the repository,
  # so it acts as a single entry point covering all of them:
  #   src/PreRelease Delist.slnx
  #     -> src/PreReleaseDelistLib/PreReleaseDelistLib.csproj
  #     -> src/PreReleaseDelistCli/PreReleaseDelistCli.csproj
  #     -> tests/PreReleaseDelistLib.FuzzTests/PreReleaseDelistLib.FuzzTests.csproj
  #
  # Versions are managed centrally, and Dependabot updates them in place. MSBuild
  # resolves the nearest Directory.Packages.props by walking up from each project,
  # so both src/Directory.Packages.props and tests/Directory.Packages.props are
  # updated rather than versions being inlined into the project files.
  - package-ecosystem: "nuget"
    directory: "/src"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    groups:
      nuget-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  # GitHub Actions workflows live in .github/workflows/, which Dependabot finds
  # via the repository root (directory: "/"). Kept on the same weekly schedule
  # and cooldown as NuGet so workflow dependency bumps arrive grouped too.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14